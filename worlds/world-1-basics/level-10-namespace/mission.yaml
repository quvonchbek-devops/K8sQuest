name: "Namespace Chalkashligi"
description: "Resurslar noto'g'ri namespace ga deploy qilingan, bu ulanish xatolariga olib kelmoqda"
objective: "Resurslarni to'g'ri namespace ga ko'chiring"
xp: 200
difficulty: intermediate
expected_time: 15m
concepts:
  - Namespaces
  - Resurslarni izolyatsiya qilish
  - kubectl namespaces
  - Namespace lar arasi aloqa
  - Namespace best practice lari

# Hosted sandbox da bu level O'YNALMAYDI — dars esa lokal o'yinda o'z o'rnida.
#
# Dars: resurslarni noto'g'ri namespace dan to'g'risiga ko'chirish. Hosted
# platforma xavfsizlik uchun foydalanuvchiga BITTA namespace (sandbox-xxx)
# beradi va apply paytida namespace ni majburan o'sha namespace ga almashtiradi
# (RBAC chegarasi). Ya'ni "boshqa namespace" tushunchasining O'ZI bu muhitda
# yo'q: yangi namespace yaratib ham, ishlatib ham bo'lmaydi. Shu sababli dars
# faqat lokal o'yinda ma'noli. Batafsil: docs/MISSION-SCHEMA.md
environments:
  hosted:
    # Tavsif overlay da almashtirilgan — tarjimasi ham shu yerda.
    i18n:
      en:
        description: "This lesson teaches moving resources between several namespaces. The hosted sandbox is a single isolated namespace, so other namespaces cannot be created or used. This lesson runs only in the local K8sQuest game."
      ru:
        description: "Этот урок учит переносу ресурсов между несколькими namespace. Хостед-песочница — один изолированный namespace, другие создавать и использовать нельзя. Этот урок доступен только в локальной игре K8sQuest."
    available: false
    description: "Bu level bir nechta namespace o'rtasida resurs ko'chirishni o'rgatadi. Hosted sandbox — bitta izolyatsiyalangan namespace; boshqa namespace yaratib/ishlatib bo'lmaydi. Dars faqat lokal o'yinda o'ynaladi."

# Tarjimalar — bu level hosted da o'ynalmaydi, lekin KATALOGDA ko'rinadi.

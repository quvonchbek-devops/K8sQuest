# `setup: manual` — broken.yaml ni SERVER qo'llamaydi, foydalanuvchi o'zi.
#
# NEGA: bu manifest 999 CPU / 999Gi so'raydi va hosted sandbox da u
# SCHEDULER GACHA YETIB BORMAYDI — namespace ning LimitRange i uni
# ADMISSION da rad etadi ("must be less than or equal to cpu limit of
# 200m"). Server uni o'zi qo'llaganda setup 500 bilan yiqilar va
# foydalanuvchi bo'sh namespace ni ko'rardi: level boshlanmasdan tugardi.
#
# Manual da esa apply ning O'Z xatosi darsning boshlanishi bo'ladi —
# talab qilingan resurs juda katta ekanini foydalanuvchi birinchi
# buyruqdayoq o'z ko'zi bilan ko'radi. O'z klasteri bo'lgan muhitda (v2,
# LimitRange yo'q) esa pod odatdagidek Pending da qoladi. Ikkala holatda
# ham tashxis bir xil va yechim bir xil.
name: "Pending Pod Muammosi"
description: "Pod mavjud resurslardan ko'proq so'rayotgani uchun Pending holatida qotib qolgan"
objective: "Resource request larni moslang, shunda pod schedule qilinsin"
xp: 150
difficulty: beginner
expected_time: 12m
concepts:
  - Pod scheduling
  - Resource requests
  - Resource limits
  - kubectl describe
  - Pending holati
  - Node sig'imi (capacity)

# Hosted sandbox da bu level BOSHQACHA ko'rinadi — dars esa o'sha-o'sha.
#
# Lokal o'yinda siz cluster-admin siz: pod yaratiladi, scheduler uni
# joylashtira olmaydi va u Pending da qotadi. Hosted da namespace ning
# LimitRange i so'rovni ADMISSION da rad etadi — pod umuman yaratilmaydi.
#
# Ikkalasi ham haqiqiy: "999 CPU so'radingiz, bu mumkin emas". Tuzatish ham
# bir xil — request larni oqilona qiymatga tushirish. Shuning uchun
# `objective`, `solution.yaml` va `validate.sh` o'zgarmaydi.
#
# `setup` ni YUQORI darajaga yozish noto'g'ri bo'lardi: o'z klasteri bo'lgan
# muhitda (v2, LimitRange yo'q) avtomatik apply bemalol ishlaydi va pod
# odatdagidek Pending da qoladi — u yerda foydalanuvchini qo'lda apply
# qilishga majburlashning ma'nosi yo'q. Shuning uchun u overlay ICHIDA.
#
# Batafsil: docs/MISSION-SCHEMA.md
environments:
  hosted:
    # Server broken.yaml ni QO'LLAMAYDI — uni foydalanuvchi o'zi qo'llaydi va
    # admission ning rad etishini o'z ko'zi bilan ko'radi. Aynan shu — darsning
    # boshlanishi. Server o'zi qo'llasa, setup 500 bilan yiqilardi va level
    # boshlanmasdan tugardi.
    setup: manual
    description: "Pod ning resource request lari namespace limitidan oshib ketgan — admission uni rad etmoqda"
    concepts:
      - Pod scheduling
      - Resource requests
      - Resource limits
      - LimitRange
      - Admission nazorati
      - Xato xabarini o'qish

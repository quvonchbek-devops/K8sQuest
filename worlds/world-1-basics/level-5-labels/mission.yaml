name: "Uzilgan Aloqa — Labels & Selectors"
description: "Service label selector mos kelmagani uchun pod larni topa olmayapti"
objective: "__APP__-service Service i __APP__-app pod ga trafikni yetkazsin (endpoint paydo bo'lsin)"
xp: 150
difficulty: beginner
expected_time: 15m
concepts:
  - Labels
  - Selectors
  - Services
  - kubectl get bilan label filtrlash
  - Service endpoints
  - Pod ulanish (connectivity)

# Generatsiya qilinadigan topshiriq (docs/DESIGN-generated-tasks.md).
#
# Nomlar HAR FOYDALANUVCHIDA boshqacha: "backend-service selector ini
# to'g'rilang" degan tayyor javob endi hech kimga yaramaydi — odam
# klasterdagi HAQIQIY pod nomini va label ini o'qishi kerak.
#
# `name` va `description` da parametr ATAYLAB yo'q: ular katalogda ham
# ko'rinadi, katalog esa namuna variantni chizadi (ParamClient.Worlds).
params:
  - name: app
    type: word
  - name: tier
    type: choice
    values: [api, web, worker, edge]

# Tarjimalar (interfeys uz/en/ru, kontent esa faqat o'zbekcha edi).
# Yo'q maydon = o'zbekchaga qaytadi (contentapi.Mission.I18n).

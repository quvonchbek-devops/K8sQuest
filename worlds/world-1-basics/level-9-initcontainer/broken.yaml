apiVersion: v1
kind: Pod
metadata:
  name: web-with-init
  namespace: k8squest
spec:
  initContainers:
  - name: wait-for-service
    image: busybox:latest
    # DNS nomidagi namespace DOWNWARD API dan olinadi — qadab yozilmaydi.
    #
    # Ilgari bu yerda `backend-service.k8squest.svc.cluster.local` turardi va
    # level hosted v1 da UMUMAN o'ynalmasdi: platforma manifestning
    # `metadata.namespace` ini sessiya namespace'iga almashtiradi, buyruq
    # MATNI ichidagi `k8squest` esa qoladi. Service `sandbox-0NN` da
    # yaratilar, init container esa mavjud bo'lmagan `k8squest` ni qidirar —
    # pod ABADIY Pending turardi.
    #
    # Qisqa nom (`backend-service`) ham YETMAYDI: busybox ning `nslookup` i
    # namespace search domain'ini o'tkazib yuborib
    # `backend-service.svc.cluster.local` ni so'raydi → NXDOMAIN. O'lchandi.
    #
    # `$NS` esa har uch muhitda to'g'ri: lokal o'yin (k8squest), hosted v1
    # (sandbox-0NN), hosted v2 (k8squest).
    env:
    - name: NS
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    # ❌ Mavjud BO'LMAGAN service ni kutadi — hech qachon tugamaydi!
    command: ['sh', '-c', 'until nslookup backend-service.$NS.svc.cluster.local; do echo waiting; sleep 2; done']
  containers:
  - name: web
    image: nginx:latest
    ports:
    - containerPort: 80

---
# Init container kutayotgan Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: k8squest
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080

---
# Init container li pod — endi service mavjud
apiVersion: v1
kind: Pod
metadata:
  name: web-with-init
  namespace: k8squest
spec:
  initContainers:
  - name: wait-for-service
    image: busybox:latest
    # Namespace DOWNWARD API dan — broken.yaml dagi bilan BIR XIL.
    # Sababi o'sha yerda batafsil yozilgan (qadab yozilgan namespace hosted
    # da levelni o'ynalmaydigan qiladi, qisqa nom esa busybox nslookup da
    # NXDOMAIN beradi).
    env:
    - name: NS
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    # ✅ Endi muvaffaqiyatli tugaydi, chunki service mavjud
    command: ['sh', '-c', 'until nslookup backend-service.$NS.svc.cluster.local; do echo waiting; sleep 2; done']
  containers:
  - name: web
    image: nginx:latest
    ports:
    - containerPort: 80

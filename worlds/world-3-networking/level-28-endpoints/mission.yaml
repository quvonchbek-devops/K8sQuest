name: "Service Endpoint lari Yangilanmayapti"
objective: "Service endpoint lari to'g'ri yangilanishi uchun readiness probe lar qo'shing"
world: 3
level: 28
xp: 200
expected_time: 12m
difficulty: intermediate

description: |
  Service ning endpoint lari pod lar qayta ishga tushganida yoki sog'lomsiz bo'lganda
  yangilanmayapti. Trafik buzilgan pod larga yo'naltirilishda davom etmoqda, bu
  xatolarga olib kelmoqda. Muammo — readiness probe lar yetishmayapti. Kubernetes
  pod lar haqiqatan trafik xizmat qilishga tayyor ekanini bilmayapti.

concepts:
  - Readiness probe lar
  - Service endpoint lari
  - Pod health check lari
  - Trafik yo'naltirish

# Tarjimalar (interfeys uz/en/ru, kontent esa faqat o'zbekcha edi).
# Yo'q maydon = o'zbekchaga qaytadi (contentapi.Mission.I18n).
i18n:
  en:
    name: "Service Endpoints Do Not Update"
    description: "Service endpoints are not updated when pods restart or become unhealthy, so traffic keeps going to broken pods — the readiness probes are missing"
    objective: "Add readiness probes so the Service endpoints update correctly"
  ru:
    name: "Endpoints сервиса не обновляются"
    description: "Endpoints не обновляются при перезапуске или отказе подов, поэтому трафик продолжает идти на сломанные поды — не хватает readiness probe"
    objective: "Добавьте readiness probe, чтобы endpoints сервиса обновлялись корректно"

name: "LoadBalancer Pending da Qotib Qoldi"
objective: "Buzilgan resurslarni tuzating va validatsiyadan o'tkazing"
difficulty: intermediate
xp: 250
expected_time: 15m

description: |
  Jamoangiz LoadBalancer turidagi service deploy qildi, lekin u 10 daqiqadan beri
  "Pending" holatida qotib turgan. Tashqi klientlar ilovaga kira olmayapti. Service
  bulutli muhitda yaxshi ishlaydi, lekin lokal ishlab chiqish klasteringiz LoadBalancer
  ta'minlay olmaydi. Service turlari orasidagi farqni tushunib, lokal ishlab chiqish
  uchun to'g'ri turni tanlashingiz kerak.

concepts:
  - service-types
  - loadbalancer
  - nodeport
  - cloud-provider-integration
  - local-cluster-limitations

# Bu level HOSTED ning ikki turida BOSHQACHA — shuning uchun overlay ZANJIR.
#
# `hosted` (v1, namespace sandbox): O'YNALMAYDI. Foydalanuvchi bitta
# izolyatsiyalangan namespace da, namespace-scoped RBAC bilan ishlaydi —
# cluster-scoped resurs ham, ikkinchi namespace ham mumkin emas.
#
# `hosted-cluster` (v2, nested klaster): O'YNAYDI. Foydalanuvchi O'Z
# klasterining cluster-admin i, to'qnashadigan qo'shni yo'q.
# O'LCHANDI (taxmin emas): L29 — k3s ServiceLB IP berdi — validate rc=0.
#
# Zanjir: `hosted` ikkalasiga, `hosted-cluster` uning ustiga (faqat farq).
# Batafsil: docs/MISSION-SCHEMA.md, services/content/environment.go
environments:
  hosted:
    available: false
    description: "Bu level LoadBalancer turidagi Service ni o'rgatadi — u bulut provayderi yoki MetalLB ni talab qiladi. Hosted sandbox da tashqi LoadBalancer yo'q. Dars faqat lokal o'yinda o'ynaladi."
  hosted-cluster:
    available: true

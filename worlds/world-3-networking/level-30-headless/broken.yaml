---
apiVersion: v1
kind: Namespace
metadata:
  name: k8squest
---
# ❌ BROKEN: Regular ClusterIP service doesn't provide per-pod DNS
# StatefulSets need headless service (clusterIP: None) for stable pod identities
apiVersion: v1
kind: Service
metadata:
  name: web-cluster
  namespace: k8squest
spec:
  # ❌ ClusterIP service (has virtual IP)
  # This gives us: web-cluster.k8squest.svc.cluster.local → random pod
  # But NOT: web-0.web-cluster.k8squest.svc.cluster.local → specific pod
  # ClusterIP QO'LDA BERILMAYDI — Kubernetes uni o'zi ajratadi.
  #
  # Ilgari bu yerda `10.96.100.50` qadab yozilgan edi. `10.96.0.0/12` —
  # kubeadm ning DEFAULT Service CIDR i; k3s da u `10.43.0.0/16`, bulutlarda
  # yana boshqacha. Ya'ni bu Service ko'pchilik klasterda UMUMAN
  # yaratilmasdi ("provided IP is not in the valid range") va level
  # boshlanmasdan yiqilardi.
  #
  # Dars uchun aniq manzil KERAK EMAS: gap shundaki bu Service da ClusterIP
  # BOR (ya'ni headless emas) — qiymati qanday bo'lishi ahamiyatsiz.
  selector:
    app: web-cluster
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: k8squest
spec:
  serviceName: web-cluster  # References the service above
  replicas: 3
  selector:
    matchLabels:
      app: web-cluster
  template:
    metadata:
      labels:
        app: web-cluster
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
          name: web

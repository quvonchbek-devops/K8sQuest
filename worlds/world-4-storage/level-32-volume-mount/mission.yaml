id: 32
title: "Volume Mount Path Error"
objective: "Buzilgan resurslarni tuzating va validatsiyadan o'tkazing"
name: "Volume Mount Yo'li Xatosi"
difficulty: intermediate
xp: 200
expected_time: 12m
xp_reward: 200
estimated_time: "10 minutes"

description: "Konteyner volume ni noto'g'ri yo'lga mount qilmoqda, bu ilovaning ma'lumotlarni o'qiy olmasligiga olib kelmoqda."
learning_objectives:
  - Understand volume and volumeMount relationship
  - Configure correct mountPath in pod specification
  - Debug volume mounting issues
  - Understand the difference between volume definition and mount point

concepts:
  - volumemounts
  - mount-path
  - volume-configuration
  - pod-volumes
  - container-filesystem

success_criteria:
  - Volume mounted at correct path /app/config
  - Pod starts successfully
  - Application can access config files

hints_available: 3

# Bu level HOSTED ning ikki turida BOSHQACHA — shuning uchun overlay ZANJIR.
#
# `hosted` (v1, namespace sandbox): O'YNALMAYDI. Foydalanuvchi bitta
# izolyatsiyalangan namespace da, namespace-scoped RBAC bilan ishlaydi —
# cluster-scoped resurs ham, ikkinchi namespace ham mumkin emas.
#
# `hosted-cluster` (v2, nested klaster): O'YNAYDI. Foydalanuvchi O'Z
# klasterining cluster-admin i, to'qnashadigan qo'shni yo'q.
# O'LCHANDI (taxmin emas): L32 — validate rc=0.
#
# Zanjir: `hosted` ikkalasiga, `hosted-cluster` uning ustiga (faqat farq).
# Batafsil: docs/MISSION-SCHEMA.md, services/content/environment.go
environments:
  hosted:
    # Tavsif overlay da almashtirilgan — tarjimasi ham shu yerda.
    i18n:
      en:
        description: "This lesson teaches cluster-scoped PersistentVolumes. The hosted sandbox has namespace-scoped RBAC and cannot touch cluster-scoped resources. This lesson runs only in the local K8sQuest game."
      ru:
        description: "Этот урок учит PersistentVolume уровня кластера. У хостед-песочницы RBAC ограничен namespace, ресурсы уровня кластера недоступны. Этот урок доступен только в локальной игре K8sQuest."
    available: false
    description: "Bu level cluster darajasidagi PersistentVolume ni o'rgatadi. Hosted sandbox scoped RBAC bilan cluster-scoped resurs yaratolmaydi. Dars faqat lokal o'yinda o'ynaladi."
  hosted-cluster:
    available: true


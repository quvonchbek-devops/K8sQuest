---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-cluster
  namespace: k8squest
spec:
  serviceName: postgres
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:14
        env:
        - name: POSTGRES_PASSWORD
          value: secretpassword
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: database-storage  # ✅ References volumeClaimTemplate
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:  # ✅ Each pod gets its own PVC!
  - metadata:
      name: database-storage
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      # Bu PVC ni PROVISIONER bog'laydi (level o'z PersistentVolume ini
  # yaratmaydi), ya'ni bu yerda KLASTERDA HAQIQATAN MAVJUD sinf turishi
  # shart. Ilgari `standard` yozilgan edi — u kind/minikube nomi, k3s da
  # esa yo'q: PVC abadiy Pending da qolar, pod hech qachon ko'tarilmas va
  # darsning O'Z nuqsoni umuman ko'rinmasdi.
  #
  # Nomni yodlamang: `kubectl get storageclass` bilan so'rang.
  # `storageClassName` ATAYLAB BERILMAGAN.
  #
  # Maydon bo'sh bo'lsa Kubernetes klasterning DEFAULT StorageClass ini
  # ishlatadi. Nom esa har distributivda boshqacha: k3s da `local-path`,
  # kind/minikube da `standard`, EKS da `gp2`, GKE da `standard-rwo`.
  # Nomni qotirib yozish level ni O'SHA distributivga bog'lab qo'yadi —
  # avval men aynan shu xatoni qilgandim (`local-path` yozgandim).
  #
  # Nomni bilish kerak bo'lsa: `kubectl get storageclass` (default i
  # `(default)` yozuvi bilan ko'rinadi).
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: k8squest
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: postgres
  ports:
  - port: 5432

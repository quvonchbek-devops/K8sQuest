---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage
  namespace: k8squest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Bu platformaning HAQIQIY sinfi (k3s ning default i). Ilgari bu yerda
  # `standard` turardi — u kind/minikube nomi va bizning klasterda
  # MAVJUD EMAS, ya'ni rasmiy yechim bilan ham level o'tmasdi:
  # "StorageClass 'standard' does not exist".
  #
  # Nomni yodlab olmang — har klasterda boshqacha bo'ladi. Uni har doim
  # so'rab bilib oling:  kubectl get storageclass
  # `storageClassName` ATAYLAB BERILMAGAN.
  #
  # Maydon bo'sh bo'lsa Kubernetes klasterning DEFAULT StorageClass ini
  # ishlatadi. Nom esa har distributivda boshqacha: k3s da `local-path`,
  # kind/minikube da `standard`, EKS da `gp2`, GKE da `standard-rwo`.
  # Nomni qotirib yozish level ni O'SHA distributivga bog'lab qo'yadi —
  # avval men aynan shu xatoni qilgandim (`local-path` yozgandim).
  #
  # Nomni bilish kerak bo'lsa: `kubectl get storageclass` (default i
  # `(default)` yozuvi bilan ko'rinadi).
---
apiVersion: v1
kind: Pod
metadata:
  name: data-processor
  namespace: k8squest
spec:
  containers:
  - name: processor
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Processing data..." && sleep 3600']
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: app-storage

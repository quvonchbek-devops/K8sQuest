---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: k8squest
type: Opaque
data:
  # ⚠️ Bu qiymatlar IKKI MARTA kodlangan — ya'ni pod ularni dekodlaganda
  # oddiy matn emas, yana base64 satrini oladi.
  #
  # `kubectl get secret db-credentials -o jsonpath='{.data.username}' | base64 -d`
  # ni bajarib ko'ring: natija "admin" emas, "YWRtaW4=" bo'ladi.
  #
  # ⚠️ Va shuni ham unutmang: base64 XAVFSIZLIK EMAS. kubectl huquqi
  # bo'lgan har kim buni bir soniyada ochadi — bu darsning ikkinchi yarmi.
  username: WVdSdGFXND0=          # base64(base64("admin"))  — NOTO'G'RI
  password: YzJWamNtVjBjR0Z6Y3pFeU13PT0=  # base64(base64("secretpass123")) — NOTO'G'RI
---
apiVersion: v1
kind: Pod
metadata:
  name: database-client
  namespace: k8squest
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "Connecting to database..."
      echo "Username: $DB_USER"
      echo "Password length: ${#DB_PASS}"
      
      # Validate credentials format
      if ! echo "$DB_USER" | grep -q '^[a-zA-Z0-9_-]\+$'; then
        echo "ERROR: Invalid username format (contains invalid characters)"
        exit 1
      fi
      
      if [ ${#DB_PASS} -lt 8 ]; then
        echo "ERROR: Password too short or malformed"
        exit 1
      fi
      
      echo "Connected successfully!"
      sleep 3600
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: username
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password

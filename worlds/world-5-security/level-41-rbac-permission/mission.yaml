level: 41
title: "RBAC Permission Denied"
objective: "Buzilgan resurslarni tuzating va validatsiyadan o'tkazing"
name: "RBAC Ruxsat Rad Etildi"
world: "Security & Production Ops"
difficulty: advanced
xp: 300
expected_time: 20m
concepts:
  - rbac
  - role
  - rolebinding
  - serviceaccount
  - permissions
description: "ServiceAccount kerakli RBAC ruxsatlariga ega emas, bu pod ning Kubernetes API ga murojaat qilishini to'sib qo'ymoqda."
learning_objectives:
  - Understand Kubernetes RBAC (Role-Based Access Control)
  - Learn to create Roles and RoleBindings
  - Configure ServiceAccount permissions
  - Debug permission denied errors

# Bu level HOSTED ning ikki turida BOSHQACHA — shuning uchun overlay ZANJIR.
#
# Dars: pod ning ServiceAccount iga kerakli huquq berilmagan; yechim —
# Role/RoleBinding ni to'g'rilash. Ya'ni yechim ServiceAccount va
# Role/RoleBinding YARATISHNI talab qiladi.
#
# `hosted` (v1, namespace sandbox): O'YNALMAYDI. Sandbox Role i
# `serviceaccounts`, `roles`, `rolebindings` ga ruxsat BERMAYDI — aks
# holda foydalanuvchi o'ziga istalgan huquqni yozib, sandbox
# chegarasidan chiqib ketardi (eskalatsiya).
#
# `hosted-cluster` (v2, nested klaster): O'YNAYDI — foydalanuvchi o'z
# klasterining cluster-admin i, eskalatsiya qiladigan joy yo'q.
#
# 2026-07-29 da `make check-content` bilan topildi: level "o'ynasa
# bo'ladi" ko'rinardi, lekin yechimni QO'LLAB bo'lmasdi.
#
# Batafsil: docs/MISSION-SCHEMA.md, services/content/environment.go
environments:
  hosted:
    # Tavsif overlay da almashtirilgan — tarjimasi ham shu yerda.
    i18n:
      en:
        description: "This lesson teaches setting up RBAC (ServiceAccount, Role, RoleBinding). The hosted sandbox does not allow those kinds — writing your own permissions would be a way out of the sandbox. This lesson runs only in the local K8sQuest game."
      ru:
        description: "Этот урок учит настройке RBAC (ServiceAccount, Role, RoleBinding). Хостед-песочница не разрешает эти типы: выдать себе права — это выход из песочницы. Этот урок доступен только в локальной игре K8sQuest."
    available: false
    description: "Bu level RBAC (ServiceAccount, Role, RoleBinding) sozlashni o'rgatadi. Hosted sandbox bu turlarga ruxsat bermaydi — aks holda o'zingizga istalgan huquqni yozib, sandbox chegarasidan chiqib ketish mumkin bo'lardi. Dars lokal o'yinda va o'z klasteri bo'lgan muhitda o'ynaladi."
  hosted-cluster:
    available: true

# Tarjimalar — bu level hosted da o'ynalmaydi, lekin KATALOGDA ko'rinadi.

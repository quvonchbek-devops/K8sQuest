# MIQDORLAR SANDBOX KONVERTIGA MOSLANDI.
#
# Ilgari bu yerda 2.5 CPU / 1Gi turardi va hosted muhitda pod darsning
# O'Z quota siga (compute-quota) yetib BORMASDI: sandbox namespace ining
# LimitRange i uni oldinroq rad etardi ("maximum cpu usage per Container
# is 500m, but limit is 3"). Ya'ni foydalanuvchi ResourceQuota haqidagi
# darsda umuman boshqa xato ko'rardi.
#
# Endi raqamlar konteyner chegarasidan (500m / 256Mi) past, lekin
# darsning quota sidan YUQORI — ya'ni to'suvchi shart aynan
# `compute-quota` bo'ladi va xabar "exceeded quota" deb keladi.
# BROKEN: ResourceQuota exceeded
# Problem: Pod requests more resources than namespace quota allows
# Result: Pod stuck in Pending - insufficient quota

apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: k8squest
spec:
  hard:
    requests.cpu: "200m"    # Jami CPU request lari 200m bilan cheklangan
    requests.memory: "128Mi" # Jami memory request lari 128Mi
    limits.cpu: "400m"
    limits.memory: "256Mi"
    pods: "10"  # Maximum 10 pods

---
# This pod requests too much!
apiVersion: v1
kind: Pod
metadata:
  name: resource-hungry-app
  namespace: k8squest
spec:
  containers:
  - name: app
    image: nginx:latest
    resources:
      requests:
        cpu: "300m"    # ❌ quota jami 200m ga ruxsat beradi — sig'maydi
        memory: "192Mi" # ❌ quota jami 128Mi
      limits:
        cpu: "400m"
        memory: "256Mi"

# Result: Pod can't be scheduled
# Error: "exceeded quota: compute-quota, requested: requests.cpu=300m"
# Quota only has 2 CPUs available, pod wants 2.5 CPUs

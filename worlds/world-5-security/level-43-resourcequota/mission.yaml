level: 43
title: "ResourceQuota: Quota Exceeded"
objective: "Buzilgan resurslarni tuzating va validatsiyadan o'tkazing"
name: "ResourceQuota Limiti Oshib Ketdi"
difficulty: advanced
xp: 300
expected_time: 20m
xp_reward: 300
world: 5
concepts:
  - resourcequota
  - limits
  - requests
  - namespace-quota
description: "Namespace dagi ResourceQuota yangi pod yaratishni to'sib qo'ymoqda, chunki resurs so'rovlari ajratilgan limitlardan oshib ketgan."
learning_objectives:
  - Understand ResourceQuota constraints
  - Configure resource requests/limits properly
  - Balance quotas with application needs
  - Debug quota-related scheduling failures

# Bu level HOSTED ning ikki turida BOSHQACHA — shuning uchun overlay ZANJIR.
#
# Dars: namespace ResourceQuota si pod so'rovini to'sib qo'yadi; yechim —
# so'rovlarni quota ichiga tushirish.
#
# `hosted` (v1, namespace sandbox): O'YNALMAYDI. Namespace-scoped RBAC
# `resourcequotas` ni na yaratishga, na o'qishga ruxsat beradi (va tayyor
# `sandbox-quota` allaqachon o'rnatilgan). validate.sh birinchi qadamdayoq
# `kubectl get resourcequota` da 403 oladi.
#
# `hosted-cluster` (v2, nested klaster): O'YNALADI — foydalanuvchi o'z
# klasterining cluster-admin i. Faqat `setup: manual` kerak: broken.yaml
# ning bir qismi ATAYLAB rad etiladi (ResourceQuota yaratiladi, pod esa
# unga sig'maydi), ya'ni apply nolga teng bo'lmagan kod qaytaradi. Server
# uni o'zi qo'llasa setup 500 bilan yiqilib, foydalanuvchi levelga umuman
# kirolmasdi. Rad etishning O'ZI darsning boshlanishi — L4 bilan bir xil
# naqsh (CNT-012).
#
# Zanjir: `hosted` ikkalasiga, `hosted-cluster` uning ustiga (faqat farq).
# Batafsil: docs/MISSION-SCHEMA.md, services/content/environment.go
environments:
  hosted:
    # Tavsif overlay da almashtirilgan — tarjimasi ham shu yerda.
    i18n:
      en:
        description: "This lesson teaches creating and watching ResourceQuota objects. The hosted sandbox's namespace-scoped RBAC does not grant that. This lesson runs only in the local K8sQuest game."
      ru:
        description: "Этот урок учит создавать и наблюдать объекты ResourceQuota. RBAC хостед-песочницы этого не даёт. Этот урок доступен только в локальной игре K8sQuest."
    available: false
    description: "Bu level ResourceQuota obyektini yaratish/kuzatishni o'rgatadi. Hosted sandbox namespace-scoped RBAC da resourcequotas ga ruxsat bermaydi. Dars faqat lokal o'yinda o'ynaladi."
  hosted-cluster:
    available: true
    setup: manual
    description: "Pod namespace ning ResourceQuota siga sig'maydi — manifest qabul qilinmaydi"

# Tarjimalar — bu level hosted da o'ynalmaydi, lekin KATALOGDA ko'rinadi.
i18n:
  en:
    name: "ResourceQuota Limit Exceeded"
  ru:
    name: "Превышен лимит ResourceQuota"

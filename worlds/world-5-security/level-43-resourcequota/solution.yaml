# SOLUTION: Adjusted resource requests to fit within quota

apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: k8squest
spec:
  hard:
    requests.cpu: "200m"    # Jami 200m
    requests.memory: "128Mi" # Jami 128Mi
    limits.cpu: "400m"
    limits.memory: "256Mi"
    pods: "10"

---
# Fixed: Reduced resource requests to fit quota
apiVersion: v1
kind: Pod
metadata:
  name: resource-hungry-app
  namespace: k8squest
spec:
  containers:
  - name: app
    image: nginx:latest
    resources:
      requests:
        cpu: "100m"   # ✅ kamaytirildi — 200m quota ga sig'adi
        memory: "64Mi" # ✅ 128Mi quota ga sig'adi
      limits:
        cpu: "200m"   # ✅ limit ham quota ga sig'adi
        memory: "128Mi"
    command: ["/bin/sh"]
    args:
    - -c
    - |
      echo "Application running with reasonable resource requests"
      echo "CPU request: 100m, Memory request: 64Mi"
      nginx -g 'daemon off;'

# Now pod schedules successfully within quota limits
# Requests: 100m CPU + 64Mi memory (200m / 128Mi quota ichida)

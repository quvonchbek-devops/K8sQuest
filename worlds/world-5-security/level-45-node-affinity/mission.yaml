level: 45
title: "Node Affinity: Scheduling Mismatch"
objective: "Buzilgan resurslarni tuzating va validatsiyadan o'tkazing"
name: "Node Affinity Nomuvofiqlik"
difficulty: advanced
xp: 300
expected_time: 20m
xp_reward: 300
world: 5
concepts:
  - node-affinity
  - required-affinity
  - preferred-affinity
  - node-labels
description: "Pod ning node affinity qoidasi hech qanday mavjud node ga mos kelmayapti, bu pod ni schedule qilinmaydigan qilib qo'ymoqda."
learning_objectives:
  - Understand required vs preferred affinity
  - Configure nodeAffinity selectors correctly
  - Match node label keys and values
  - Debug scheduling failures

# Bu level HOSTED ning ikki turida BOSHQACHA — shuning uchun overlay ZANJIR.
#
# Dars: pod nodeAffinity bilan mos node ni topa olmayapti; yechim — node ga
# kerakli label qo'yish yoki affinity ni to'g'rilash. Ya'ni dars NODE ustida
# amal talab qiladi.
#
# `hosted` (v1, namespace sandbox): O'YNALMAYDI. Node — cluster-scoped
# obyekt; sandbox foydalanuvchisi unga na yozadi, na label qo'yadi.
# O'lchandi (2026-07-29 sweep):
#   "No node found with label 'accelerator=gpu'" — va foydalanuvchi uni
#   qo'ya OLMAYDI, ya'ni level hech qanday yo'l bilan yechilmaydi.
# Ustiga node UMUMIY: bir foydalanuvchi qo'ygan label boshqalarning
# podlariga ham ta'sir qilardi.
#
# `hosted-cluster` (v2, nested klaster): O'YNAYDI — node ham faqat
# foydalanuvchiniki.
environments:
  hosted:
    # Tavsif overlay da almashtirilgan — tarjimasi ham shu yerda.
    i18n:
      en:
        description: "This lesson teaches labelling nodes. A node is cluster-scoped and shared by every user, so a sandbox cannot write to it. This lesson runs only in the local K8sQuest game."
      ru:
        description: "Этот урок учит проставлять метки на узлы. Узел — объект уровня кластера, общий для всех пользователей, песочница в него писать не может. Этот урок доступен только в локальной игре K8sQuest."
    available: false
    description: "Bu level node ga label qo'yishni o'rgatadi. Node — cluster darajasidagi va BARCHA foydalanuvchilar bo'lishadigan obyekt; hosted sandbox unga tegishga ruxsat bermaydi. Dars lokal o'yinda va o'z klasteri bo'lgan muhitda o'ynaladi."
  hosted-cluster:
    available: true

# Tarjimalar — bu level hosted da o'ynalmaydi, lekin KATALOGDA ko'rinadi.
i18n:
  en:
    name: "Node Affinity Mismatch"
  ru:
    name: "Несовпадение node affinity"

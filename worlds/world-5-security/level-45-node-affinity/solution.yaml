# SOLUTION: NodeAffinity with correct labels

# MUHIM: bu fayl faqat POD ni tuzatadi. Node ga label qo'yish ALOHIDA
# qadam va uni shu manifest bajara olmaydi — buyruqni o'zingiz yozasiz:
#
#   NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
#   kubectl label nodes "$NODE" accelerator=gpu
#
# Node nomi ATAYLAB o'zgaruvchida: u har muhitda boshqacha (nested
# klasterda `dojo-cluster-<id>`), qotirib yozilgan nom esa ishlamaydi.

apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload
  namespace: k8squest
spec:
  containers:
  - name: ml-training
    image: nginx:latest
    command: ['sh', '-c', 'echo "✅ GPU workload scheduled successfully on node: $MY_NODE_NAME"; sleep 3600']
    env:
    - name: MY_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  affinity:
    nodeAffinity:
      # ✅ REQUIRED: Must match or pod won't schedule
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: accelerator  # ✅ Correct key
            operator: In
            values:
            - gpu  # ✅ Correct value
      # ✅ PREFERRED: Nice to have, but not required  
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          # Muhitdan MUSTAQIL label. Ilgari bu yerda `kubernetes.io/hostname`
          # `kind-control-plane` ga tenglashtirilgan edi — bunday node bizning
          # klasterlarda YO'Q. U yumshoq shart bo'lgani uchun scheduling ni
          # bloklamasdi, lekin darsda qotirilgan node nomi yomon naqsh:
          # o'quvchi uni ko'chirib, keyin required da ishlatadi va pod
          # abadiy Pending da qoladi.
          - key: kubernetes.io/os
            operator: In
            values:
            - linux

# This configuration:
# 1. REQUIRES node with label accelerator=gpu
# 2. PREFERS linux node (weight 100) — yumshoq shart, muhitdan mustaqil
# 3. Required bajarilsa, preferred bajarilmasa ham pod joylashadi
#
# The pod now schedules successfully!

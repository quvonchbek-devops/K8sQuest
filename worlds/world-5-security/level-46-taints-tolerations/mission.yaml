level: 46
title: "Taints & Tolerations: NoSchedule"
objective: "Buzilgan resurslarni tuzating va validatsiyadan o'tkazing"
name: "Taint lar va Toleration lar"
difficulty: advanced
xp: 350
expected_time: 25m
xp_reward: 350
world: 5
concepts:
  - taints
  - tolerations
  - noschedule
  - noexecute
description: "Node da taint bor lekin pod mos toleration ga ega emas, bu pod ning shu node ga schedule qilinishini to'sib qo'ymoqda."
learning_objectives:
  - Understand taints and tolerations
  - Configure tolerations correctly
  - Differentiate NoSchedule, PreferNoSchedule, NoExecute
  - Debug taint-related scheduling failures

# Bu level HOSTED ning ikki turida BOSHQACHA — shuning uchun overlay ZANJIR.
#
# Dars: node taint qilingan, pod da mos toleration yo'q. Ya'ni dars NODE
# ustida amal talab qiladi.
#
# `hosted` (v1, namespace sandbox): O'YNALMAYDI va bu IKKI SABABDAN:
#   1. RBAC — o'lchandi (2026-07-29 sweep):
#      "nodes \"dev\" is forbidden: ... cannot patch resource \"nodes\"
#      at the cluster scope";
#   2. Xavfsizlik — `validate.sh` ning o'zi node ni taint qilishga
#      urinadi. Ruxsat berilganda u UMUMIY node ni zaharlar va BOSHQA
#      foydalanuvchilarning podlarini node dan quvib chiqarardi.
#
# `hosted-cluster` (v2, nested klaster): O'YNAYDI — node faqat
# foydalanuvchiniki, zaharlanadigan qo'shni yo'q.
environments:
  hosted:
    # Tavsif overlay da almashtirilgan — tarjimasi ham shu yerda.
    i18n:
      en:
        description: "This lesson teaches tainting nodes. A node is shared by every user, so the hosted sandbox cannot taint it. This lesson runs only in the local K8sQuest game."
      ru:
        description: "Этот урок учит ставить taint на узлы. Узел общий для всех пользователей, поэтому хостед-песочница этого не может. Этот урок доступен только в локальной игре K8sQuest."
    available: false
    description: "Bu level node taint qilishni o'rgatadi. Node — barcha foydalanuvchilar bo'lishadigan obyekt; hosted sandbox unga tegishga ruxsat bermaydi (aks holda bir kishining taint i boshqalarning podlarini quvib chiqarardi). Dars lokal o'yinda va o'z klasteri bo'lgan muhitda o'ynaladi."
  hosted-cluster:
    available: true

# Tarjimalar — bu level hosted da o'ynalmaydi, lekin KATALOGDA ko'rinadi.
i18n:
